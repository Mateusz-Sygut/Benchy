<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konto aktywowane · ŁawAppka</title>
  <style>
    :root {
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #e8f5e8;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      color: #1b3a1f;
    }
    main {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px 32px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(46, 125, 50, 0.12);
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #2e7d32;
      color: #fff;
      font-size: 32px;
      line-height: 64px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 700;
    }
    p {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #333;
    }
    .en {
      margin-top: 16px;
      font-size: 14px;
      color: #666;
    }
    .fail h1 { color: #b71c1c; }
    .fail .mark { background: #f44336; }
  </style>
</head>
<body>
  <main id="card">
    <div class="mark">✓</div>
    <h1>Konto aktywowane</h1>
    <p>Adres e-mail jest potwierdzony. Zamknij tę stronę, wróć do ŁawAppki i zaloguj się.</p>
    <p class="en">Your email is confirmed. Close this page, return to Benchy, and sign in.</p>
  </main>
  <script>
    var params = new URLSearchParams(window.location.search);
    var hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    var failed = params.get("error") || hash.get("error");
    if (failed) {
      var card = document.getElementById("card");
      card.className = "fail";
      card.querySelector(".mark").textContent = "!";
      card.querySelector("h1").textContent = "Nie udało się aktywować";
      card.querySelector("p").textContent = "Link wygasł albo został już użyty. Wróć do ŁawAppki i zaloguj się, a jeśli to nie wejdzie, zarejestruj się ponownie.";
      card.querySelector(".en").textContent = "This link expired or was already used. Return to Benchy and sign in, or register again.";
    }
  </script>
</body>
</html>
